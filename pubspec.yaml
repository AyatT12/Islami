name: islami
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_native_splash: ^2.4.8
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/files/Suras/
    - assets/files/Hadith/

  fonts:
    - family: Janna LT
      fonts:
        - asset: assets/fonts/ArbFONTS-ArbFONTS-Janna-LT-Bold.ttf
